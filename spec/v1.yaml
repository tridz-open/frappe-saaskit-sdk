openapi: 3.1.0
info:
  title: saas_core API
  version: 1.4.0
  license:
    name: MIT
  description: 'Generic SaaS control-plane API. Success responses are wrapped by Frappe as `{"message": <payload>}`; errors use the `Error` schema
    (saas_core installs an exception handler that emits it with the HTTP status). GET methods take query params, POST methods take a JSON body.
    Mutations accept `Idempotency-Key`. Pagination is cursor-based (`cursor`, `limit` -> `next_cursor`). Additive changes only within v1.'
servers:
- url: https://{host}
  variables:
    host:
      default: control.example.com
tags:
- name: public
- name: session
- name: customer
- name: tenants
- name: backups
- name: billing
- name: jobs
- name: support
- name: events
- name: webhooks
- name: tokens
- name: team
- name: admin
paths:
  /api/method/saas_core.api.v1.plans.list:
    get:
      operationId: plansList
      summary: List public plans
      tags:
      - public
      parameters:
      - name: currency
        in: query
        required: false
        schema:
          type: string
      - name: interval
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Interval'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: object
                    required:
                    - items
                    - next_cursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Plan'
                      next_cursor:
                        type:
                        - string
                        - 'null'
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.templates.list:
    get:
      operationId: templatesList
      summary: List public templates
      tags:
      - public
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: object
                    required:
                    - items
                    - next_cursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Template'
                      next_cursor:
                        type:
                        - string
                        - 'null'
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.signup:
    post:
      operationId: signup
      summary: Create a customer account (optionally with intended plan/template)
      tags:
      - public
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      security: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/Me'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '403': &id006
          $ref: '#/components/responses/Forbidden'
        '409': &id005
          $ref: '#/components/responses/Conflict'
        '422': &id004
          $ref: '#/components/responses/Unprocessable'
        '429': &id002
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
      description: Returns 403 with error.code `signup_disabled` (signup closed), `not_allowlisted` (email not on the allowlist) or `invite_required`
        (invite-only mode and no valid `invite_token`).
  /api/method/saas_core.api.v1.login:
    post:
      operationId: login
      summary: Password login, sets session cookie
      tags:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/Me'
        '400': *id001
        '401': &id003
          $ref: '#/components/responses/Unauthorized'
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.logout:
    post:
      operationId: logout
      summary: Destroy session
      tags:
      - session
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '204':
          description: No content
        '401': *id003
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.password_reset.request:
    post:
      operationId: passwordResetRequest
      summary: Email a reset link (always 202)
      tags:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      security: []
      responses:
        '202':
          description: No content
        '400': *id001
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.password_reset.confirm:
    post:
      operationId: passwordResetConfirm
      summary: Set a new password with the emailed key
      tags:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              - new_password
              properties:
                key:
                  type: string
                new_password:
                  type: string
                  format: password
                  minLength: 10
      security: []
      responses:
        '204':
          description: No content
        '400': *id001
        '422': *id004
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.verify_email.request:
    post:
      operationId: verifyEmailRequest
      summary: Email a verification link to the current user
      tags:
      - session
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '202':
          description: No content
        '401': *id003
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.verify_email.confirm:
    post:
      operationId: verifyEmailConfirm
      summary: Verify the current user email with the emailed key
      tags:
      - session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '204':
          description: No content
        '400': *id001
        '401': *id003
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.checkout.create_session:
    post:
      operationId: checkoutCreateSession
      summary: Create a hosted gateway checkout session for a new or existing tenant
      tags:
      - public
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/CheckoutSession'
        '400': *id001
        '401': *id003
        '404': &id007
          $ref: '#/components/responses/NotFound'
        '409': *id005
        '422': *id004
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.checkout.verify_payment:
    post:
      operationId: checkoutVerifyPayment
      summary: Verify a client-side payment callback (e.g. Razorpay Checkout handler); same event path as webhooks
      tags:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/VerifyPaymentResult'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '422': *id004
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
      description: Signature failures return 401 `invalid_signature`. Replays return status `duplicate`.
  /api/method/saas_core.api.v1.config:
    get:
      operationId: publicConfig
      summary: Public deployment config (signup toggle, payment banner)
      tags:
      - public
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/PublicConfig'
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.admin.tenants.list:
    get:
      operationId: adminTenantsList
      summary: List all tenants across owners (SaaS Admin only)
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TenantStatus'
      - name: owner_email
        in: query
        required: false
        schema:
          type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: object
                    required:
                    - items
                    - next_cursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
                      next_cursor:
                        type:
                        - string
                        - 'null'
        '401': *id003
        '403': *id006
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
      description: Requires the SaaS Admin role.
  /api/method/saas_core.api.v1.admin.tenants.create:
    post:
      operationId: adminTenantsCreate
      summary: Create a tenant on behalf of an owner (SaaS Admin only)
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTenantCreateRequest'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/TenantCreated'
        '400': *id001
        '401': *id003
        '403': *id006
        '409': *id005
        '422': *id004
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
      description: Requires the SaaS Admin role. Returns 503 `capacity_exhausted` when no server has capacity.
  /api/method/saas_core.api.v1.admin.tenants.invite:
    post:
      operationId: adminTenantsInvite
      summary: Invite a tenant owner by email (SaaS Admin only)
      tags:
      - admin
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTenantInviteRequest'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/TeamMember'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '409': *id005
        '422': *id004
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
      description: Requires the SaaS Admin role. Sends an owner invite for an existing tenant.
  /api/method/saas_core.api.v1.me:
    get:
      operationId: me
      summary: Current user, entitlements and counts
      tags:
      - customer
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/Me'
        '401': *id003
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.list:
    get:
      operationId: tenantsList
      summary: List my tenants
      tags:
      - tenants
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TenantStatus'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: object
                    required:
                    - items
                    - next_cursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
                      next_cursor:
                        type:
                        - string
                        - 'null'
        '401': *id003
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.get:
    get:
      operationId: tenantsGet
      summary: Get a tenant
      tags:
      - tenants
      parameters:
      - name: tenant
        in: query
        required: true
        schema:
          type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/Tenant'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.slug_availability:
    get:
      operationId: tenantsSlugAvailability
      summary: Check whether a workspace address (slug) is available
      tags:
      - tenants
      parameters:
      - name: slug
        in: query
        required: true
        schema:
          type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/SlugAvailability'
        '400': *id001
        '401': *id003
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.create:
    post:
      operationId: tenantsCreate
      summary: Create a tenant (starts provisioning once payment/trial is satisfied); returns tenant + provision job
      tags:
      - tenants
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/TenantCreated'
        '400': *id001
        '401': *id003
        '403': *id006
        '409': *id005
        '422': *id004
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.duplicate:
    post:
      operationId: tenantsDuplicate
      summary: Duplicate a tenant from its latest backup
      tags:
      - tenants
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenant
              - slug
              properties:
                tenant:
                  type: string
                slug:
                  $ref: '#/components/schemas/Slug'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/TenantCreated'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '409': *id005
        '422': *id004
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.request_delete:
    post:
      operationId: tenantsRequestDelete
      summary: Request deletion (creates an approval; terminate runs after approval)
      tags:
      - tenants
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenant
              - confirm_slug
              properties:
                tenant:
                  type: string
                confirm_slug:
                  type: string
                reason:
                  type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/Job'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '409': *id005
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.setup_complete:
    post:
      operationId: tenantsSetupComplete
      summary: 'Tenant site callback: setup finished (HMAC-signed, guest)'
      tags:
      - tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - site
              - completed_at
              properties:
                site:
                  type: string
                completed_at:
                  type: string
                  format: date-time
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/SetupComplete'
        '401': *id003
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
      description: 'Called by the ury_setup app on the tenant site, not by customers. The raw JSON body is signed with the per-tenant secret:
        header `X-Ury-Signature: sha256=<hex HMAC-SHA256>`. Any failure (unknown site, bad MAC, stale `completed_at`) is `401 invalid_signature`.
        Idempotent.'
  /api/method/saas_core.api.v1.tenants.suspend_status:
    get:
      operationId: tenantsSuspendStatus
      summary: Why is the tenant suspended / dunning stage
      tags:
      - tenants
      parameters:
      - name: tenant
        in: query
        required: true
        schema:
          type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/SuspendStatus'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.open_login_link:
    post:
      operationId: tenantsOpenLoginLink
      summary: Mint a one-time SSO link to the tenant site
      tags:
      - tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenant
              properties:
                tenant:
                  type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/LoginLink'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '409': *id005
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.backups.list:
    get:
      operationId: backupsList
      summary: List tenant backups
      tags:
      - backups
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: tenant
        in: query
        required: true
        schema:
          type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: object
                    required:
                    - items
                    - next_cursor
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Backup'
                      next_cursor:
                        type:
                        - string
                        - 'null'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.backups.create:
    post:
      operationId: backupsCreate
      summary: Trigger an on-demand backup
      tags:
      - backups
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenant
              properties:
                tenant:
                  type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/Job'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '409': *id005
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.tenants.backups.download_link:
