  /api/method/saas_core.api.v1.tenants.backups.restore:
    post:
      operationId: backupsRestore
      summary: 'Restore a backup (guarded: returns a pending approval request)'
      tags:
      - backups
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tenant
              - backup
              properties:
                tenant:
                  type: string
                backup:
                  type: string
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    $ref: '#/components/schemas/RestoreApproval'
        '400': *id001
        '401': *id003
        '403': *id006
        '404': *id007
        '409': *id005
        '429': *id002
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.api.v1.events.stream:
    get:
      operationId: eventsStream
      summary: Server-Sent Events stream of job/tenant/subscription state changes
      tags:
      - events
      description: 'text/event-stream. Each event: `id: <seq>`, `event: <EventType>`, `data: <Event JSON>`. Heartbeat comment `:hb` every 15s.
        Reconnect with `Last-Event-ID` (or `since`) to replay up to 500 events / 10 min; on gap server sends `event: resync`. Browsers using cookie
        auth only; for non-cookie clients use fetch streaming with headers.'
      security:
      - cookieAuth: []
      - apiKey: []
      - bearerAuth: []
      parameters:
      - name: tenant
        in: query
        schema:
          type: string
      - name: job
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: integer
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
              x-event-schema:
                $ref: '#/components/schemas/Event'
        '401': *id003
        '403': *id006
        default:
          $ref: '#/components/responses/Error'
  /api/method/saas_core.webhooks.razorpay:
    post:
      operationId: webhookRazorpay
      summary: Razorpay webhook receiver (signature verified, raw payload stored, idempotent by gateway event id, enqueued, 200 fast)
      tags:
      - webhooks
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted (also returned for duplicate events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - accepted
                    - duplicate
                    - ignored
        '400':
          description: Bad payload
        '401':
          description: Invalid signature
  /api/method/saas_core.webhooks.stripe:
    post:
      operationId: webhookStripe
      summary: Stripe webhook receiver (signature verified, raw payload stored, idempotent by gateway event id, enqueued, 200 fast)
      tags:
      - webhooks
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted (also returned for duplicate events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - accepted
                    - duplicate
                    - ignored
        '400':
          description: Bad payload
        '401':
          description: Invalid signature
  /api/method/saas_core.webhooks.paddle:
    post:
      operationId: webhookPaddle
      summary: Paddle webhook receiver (signature verified, raw payload stored, idempotent by gateway event id, enqueued, 200 fast)
      tags:
      - webhooks
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted (also returned for duplicate events)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - accepted
                    - duplicate
                    - ignored
        '400':
          description: Bad payload
        '401':
          description: Invalid signature
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe session; mutations also need X-Frappe-CSRF-Token (from `me.csrf_token`)
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: '`token <api_key>:<api_secret>`'
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth2 access token or scoped per-tenant PAT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Same key+same body within 24h returns the original response; same key+different body is 409 idempotency_mismatch.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Not allowed (also returned for other users'' tenants to avoid enumeration: 404 is used instead)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found or not owned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict / slug taken / idempotency mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Capacity exhausted (error.code capacity_exhausted)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Interval:
      type: string
      enum:
      - month
      - year
    Slug:
      type: string
      pattern: ^[a-z][a-z0-9-]{2,30}[a-z0-9]$
    TenantStatus:
      type: string
      enum:
      - pending
      - provisioning
      - active
      - suspended
      - terminating
      - failed
    JobKind:
      type: string
      enum:
      - provision
      - suspend
      - resume
      - change_plan
      - terminate
      - backup
      - duplicate
    JobState:
      type: string
      enum:
      - pending
      - dispatching
      - submitted
      - running
      - succeeded
      - failed
      - stuck
      - outcome_unknown
      - needs_attention
    SubscriptionStatus:
      type: string
      enum:
      - trialing
      - active
      - past_due
      - canceled
    Gateway:
      type: string
      enum:
      - razorpay
      - stripe
      - paddle
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          description: minor units
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Plan:
      type: object
      required:
      - code
      - title
      - prices
      - limits
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
        prices:
          type: array
          items:
            type: object
            required:
            - interval
            - amount
            - currency
            properties:
              interval:
                $ref: '#/components/schemas/Interval'
              amount:
                type: integer
              currency:
                type: string
        limits:
          type: object
          additionalProperties: true
        trial_days:
          type: integer
        template:
          type:
          - string
          - 'null'
        features:
          type: array
          items:
            type: string
        available:
          type: boolean
          description: false when capacity gate is closed
    Template:
      type: object
      required:
      - slug
      - title
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        min_plan:
          type:
          - string
          - 'null'
        signup_schema:
          type: object
          description: JSON-Schema for recipe-supplied signup/tenant fields
          additionalProperties: true
    SignupRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 10
        full_name:
          type: string
        plan:
          type: string
        template:
          type: string
        recipe_fields:
          type: object
          additionalProperties: true
        invite_token:
          type: string
          description: Invite token from a team invite; satisfies invite-only signup
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    PublicConfig:
      type: object
      required:
      - public_signup
      properties:
        public_signup:
          type: boolean
          description: When false, signup returns 403 signup_disabled
        payment_banner:
          type:
          - string
          - 'null'
          description: Non-empty when payments are mocked/test mode; show as a site-wide banner
        site_domain:
          type:
          - string
          - 'null'
          description: Base domain for tenant sites (`<slug>.<site_domain>`); null when unset
    SlugAvailability:
      type: object
      required:
      - slug
      - available
      - reason
      - message
      - suggestion
      properties:
        slug:
          type: string
          description: Normalised (trimmed, lowercase) input
        available:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          enum:
          - invalid
          - reserved
          - taken
          - null
        message:
          type: string
        suggestion:
          type:
          - string
          - 'null'
          description: A free alternative slug, when one could be derived
    AdminTenantCreateRequest:
      type: object
      required:
      - owner_email
      - plan
      properties:
        owner_email:
          type: string
          format: email
        name:
          type: string
          description: Display name
        subdomain:
          allOf:
          - $ref: '#/components/schemas/Slug'
          description: Subdomain/slug; server derives one from name when omitted
        plan:
          type: string
          description: Plan code
        template:
          type: string
      anyOf:
      - required:
        - name
      - required:
        - subdomain
    AdminTenantInviteRequest:
      type: object
      required:
      - tenant
      - owner_email
      properties:
        tenant:
          type: string
        owner_email:
          type: string
          format: email
    Me:
      type: object
      required:
      - user
      - email
      properties:
        user:
          type: string
        email:
          type: string
        full_name:
          type: string
        roles:
          type: array
          items:
            type: string
        tenant_count:
          type: integer
        csrf_token:
          type: string
    CheckoutRequest:
      type: object
      required:
      - plan
      - interval
      - success_url
      - cancel_url
      properties:
        tenant:
          type: string
          description: existing tenant (change/resume) else created from slug
        slug:
          $ref: '#/components/schemas/Slug'
        template:
          type: string
        plan:
          type: string
        interval:
          $ref: '#/components/schemas/Interval'
        currency:
          type: string
        gateway:
          $ref: '#/components/schemas/Gateway'
        success_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri
        recipe_fields:
          type: object
          additionalProperties: true
    CheckoutSession:
      type: object
      required:
      - gateway
      - session_id
      - url
      properties:
        payment_mocked:
          type: boolean
          description: True when the gateway is mocked (no real charge)
        subscription_status:
          type: string
        gateway:
          $ref: '#/components/schemas/Gateway'
        client_payload:
          oneOf:
          - $ref: '#/components/schemas/RazorpayClientPayload'
          - $ref: '#/components/schemas/GenericClientPayload'
          description: Present when the gateway is completed in-page (e.g. Razorpay Checkout) instead of by redirecting to `url`
        session_id:
          type: string
        url:
          type: string
          format: uri
        tenant:
          type: string
        public_key:
          type: string
          description: publishable key (never secret)
        expires_at:
          type: string
          format: date-time
        fallback:
          type: string
          enum:
          - invoice
          description: Present when a Razorpay subscription fell back to a one-time order; the customer pays an invoice instead of a recurring
            mandate
    RazorpayClientPayload:
      type: object
      required:
      - provider
      - key
      - mode
      properties:
        provider:
          type: string
          enum:
          - razorpay
        key:
          type: string
          description: publishable key id
        mode:
          type: string
          enum:
          - order
          - subscription
        order_id:
          type: string
        subscription_id:
          type: string
        amount:
          type: integer
          description: minor units (order mode)
        currency:
          type: string
        name:
          type: string
        description:
          type: string
        prefill:
          type: object
          properties:
            email:
              type: string
          additionalProperties: true
        notes:
          type: object
          additionalProperties: true
    GenericClientPayload:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
      additionalProperties: true
    VerifyPaymentRequest:
      type: object
      required:
      - gateway
      - payload
      properties:
        gateway:
          type: string
          enum:
          - razorpay
          - stripe
          - paddle
          - manual
        payload:
          type: object
          additionalProperties: true
          description: Gateway client-callback data (e.g. razorpay_payment_id, razorpay_signature, razorpay_subscription_id|razorpay_order_id)
    VerifyPaymentResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - duplicate
          - accepted
          - ignored
          description: 'duplicate: event already recorded; accepted: queued for processing; ignored: recorded but irrelevant'
        tenant:
          type: string
    Tenant:
      type: object
      required:
      - name
      - slug
      - status
      - plan
      properties:
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        status:
          $ref: '#/components/schemas/TenantStatus'
        plan:
          type: string
        template:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
          description: public site URL once active
        custom_domain:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        active_job:
          type:
          - string
          - 'null'
        suspend_reason:
          type:
          - string
          - 'null'
    TenantCreateRequest:
      type: object
      required:
      - slug
      - plan
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        plan:
          type: string
        template:
          type: string
        region:
          type: string
        recipe_fields:
          type: object
          additionalProperties: true
    TenantCreated:
      type: object
      required:
      - tenant
      - job
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        job:
          $ref: '#/components/schemas/Job'
        checkout_required:
          type: boolean
    SuspendStatus:
      type: object
      required:
      - suspended
      properties:
        suspended:
          type: boolean
        reason:
          type:
          - string
          - 'null'
          enum:
          - dunning
          - manual
          - abuse
          - canceled
          - null
        dunning_stage:
          type: integer
        since:
          type:
          - string
          - 'null'
          format: date-time
        resume_by_paying:
          type: boolean
    SetupComplete:
      type: object
      required:
      - tenant
      - status
      properties:
        tenant:
          type: string
        status:
          type: string
          enum:
          - completed
          - already_completed
    LoginLink: &id008
      type: object
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    DownloadLink: *id008
    PortalLink: *id008
    Backup:
      type: object
      required:
      - name
      - created_at
      properties:
        name:
          type: string
        created_at:
          type: string
          format: date-time
        size_bytes:
          type:
          - integer
          - 'null'
        kind:
          type: string
          enum:
          - scheduled
          - on_demand
        parts:
          type: array
          items:
            type: string
            enum:
            - database
            - public
            - private
    Subscription:
      type: object
      required:
      - tenant
      - plan
      - status
      properties:
        payment_mocked:
          type: boolean
          description: True when the payment gateway is mocked (no real charge)
        tenant:
          type: string
        plan:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        gateway:
          $ref: '#/components/schemas/Gateway'
        interval:
          $ref: '#/components/schemas/Interval'
        period_end:
          type:
          - string
          - 'null'
          format: date-time
        cancel_at_period_end:
          type: boolean
        dunning_stage:
          type: integer
        trial_end:
          type:
          - string
          - 'null'
          format: date-time
    Invoice:
      type: object
      required:
      - name
      - status
      - total
      properties:
        payment_mocked:
          type: boolean
          description: True when the payment gateway is mocked (no real charge)
        name:
          type: string
        tenant:
          type: string
        number:
          type: string
        status:
          type: string
          enum:
          - draft
          - open
          - paid
          - void
          - uncollectible
          - refunded
        total:
          $ref: '#/components/schemas/Money'
        issued_at:
          type: string
          format: date-time
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        has_pdf:
          type: boolean
    JobStep:
      type: object
      required:
      - seq
      - name
      - state
      properties:
        seq:
          type: integer
        name:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        message:
          type:
          - string
          - 'null'
    Job:
      type: object
      required:
      - name
      - tenant
      - kind
      - state
      properties:
        name:
          type: string
        tenant:
          type: string
        kind:
          $ref: '#/components/schemas/JobKind'
        state:
          $ref: '#/components/schemas/JobState'
        progress:
          type: number
          minimum: 0
          maximum: 1
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JobStep'
        attempts:
          type: integer
        needs_attention:
          type: boolean
        error:
          type:
          - string
          - 'null'
          description: customer-safe message, no FC internals
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    SupportTicket:
      type: object
      required:
      - name
      - subject
      - status
      properties:
        name:
          type: string
        tenant:
          type:
          - string
          - 'null'
        subject:
          type: string
        status:
          type: string
          enum:
          - open
          - pending
          - resolved
          - closed
        priority:
          type: string
        created_at:
          type: string
          format: date-time
        replies:
          type: array
          items:
            type: object
            properties:
              from_staff:
                type: boolean
              body:
                type: string
              at:
                type: string
                format: date-time
    EventType:
      type: string
      enum:
      - job.updated
      - job.step
      - tenant.updated
      - subscription.updated
      - invoice.created
      - resync
    ApiToken:
      type: object
      required:
      - name
      - label
      - created_at
      properties:
        name:
          type: string
        label:
          type: string
        tenant:
          type:
          - string
          - 'null'
        prefix:
          type: string
          description: first chars of the key for identification
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    ApiTokenCreated:
      type: object
      required:
      - token
      - secret
      properties:
        token:
          $ref: '#/components/schemas/ApiToken'
        secret:
          type: string
          description: shown once; use as `token <api_key>:<secret>`
        api_key:
          type: string
    TeamRole:
      type: string
      enum:
      - owner
      - admin
      - member
      - viewer
    TeamMember:
      type: object
      required:
      - name
      - email
      - role
      - status
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        full_name:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/TeamRole'
        status:
          type: string
          enum:
          - active
          - invited
        invited_at:
          type:
          - string
          - 'null'
          format: date-time
    RestoreApproval:
      type: object
      required:
      - approval_request
      - status
      properties:
        approval_request:
          type: string
        status:
          type: string
          enum:
          - pending_approval
    EventJobUpdated:
      type: object
      required:
      - seq
      - type
      - at
      - data
      properties:
        seq: &id009
          type: integer
        at: &id010
          type: string
          format: date-time
        tenant: &id011
          type: string
        job: &id012
          type: string
        type:
          type: string
          enum:
          - job.updated
        data:
          $ref: '#/components/schemas/Job'
    EventTenantUpdated:
      type: object
      required:
      - seq
      - type
      - at
      - data
      properties:
        seq: *id009
        at: *id010
        tenant: *id011
        job: *id012
        type:
          type: string
          enum:
          - tenant.updated
        data:
          $ref: '#/components/schemas/Tenant'
    EventSubscriptionUpdated:
      type: object
      required:
      - seq
      - type
      - at
      - data
